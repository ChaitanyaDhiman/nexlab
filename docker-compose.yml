services:
  nexlab:
    build:
      context: .
      dockerfile: dockerfile
    container_name: nexlab
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run:/host/var/run:ro
      - /sys/class/power_supply:/sys/class/power_supply:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /proc:/host/proc:ro
      # Storage monitoring - mount configured drives
      - /:/host/root:ro
      - /mnt:/host/root/mnt:ro
      # Shared volume for update status (needs write access for trigger file)
      - update-data:/data
      # Persist user configuration files across rebuilds
      - /srv/docker-data/nexlab/config:/app/config
    environment:
      - UPDATE_AGENT_URL=http://update-agent:5000
    depends_on:
      - update-agent
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  update-agent:
    build:
      context: ./update-agent
      dockerfile: dockerfile
    container_name: update-agent
    restart: unless-stopped
    privileged: true
    pid: host
    networks:
      - proxy_net
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - UPDATE_STATUS_FILE=/data/update-status.json
      - TRIGGER_FILE=/data/trigger-refresh
      - CHECK_INTERVAL_SECONDS=3600 # Check every hour
      - PORT=5000
    volumes:
      # Shared volume for output and triggers
      - update-data:/data
      - ./update-agent/update-check.py:/app/update-check.py:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  update-data:


networks:
  proxy_net:
    external: true
